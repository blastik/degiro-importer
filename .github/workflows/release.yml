name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package
        # manifest.json and addon.js at the zip root, matching `main: "addon.js"`
        run: |
          cp manifest.json README.md dist/
          cd dist && zip -r ../degiro-importer.zip . -x '*.map'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: degiro-importer.zip
          generate_release_notes: true
